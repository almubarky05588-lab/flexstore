name: Build iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.flexstore.flexstore
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      FASTLANE_SKIP_UPDATE_CHECK: 1
      FASTLANE_HIDE_CHANGELOG: 1

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null \
            || echo "using default Xcode"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: |
          mkdir -p /tmp/keep
          cp -r lib assets pubspec.yaml /tmp/keep/
          flutter create --platforms=ios --org com.flexstore --project-name flexstore .
          rm -rf lib assets pubspec.yaml test
          cp -r /tmp/keep/lib /tmp/keep/assets .
          cp /tmp/keep/pubspec.yaml .

      - name: Patch Info.plist
        run: |
          PL=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string ar" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ar" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ar" "$PL"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'photo access'" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'photo access'" "$PL"

      - run: flutter pub get

      - name: Set build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 1 ))" >> $GITHUB_ENV

      - name: Prepare Xcode project
        run: |
          flutter build ios --config-only --release --no-codesign \
            --build-number=${{ env.BUILD_NUMBER }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} || true

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ios/keys
          printf '%s\n' "$ASC_KEY_P8" > ios/keys/AuthKey.p8

      - name: Create Fastfile
        run: |
          mkdir -p ios/fastlane
          cat > ios/fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            lane :beta do
              key_path = File.expand_path("../keys/AuthKey.p8", __dir__)

              api_key = app_store_connect_api_key(
                key_id: ENV["ASC_KEY_ID"],
                issuer_id: ENV["ASC_ISSUER_ID"],
                key_filepath: key_path,
                in_house: false
              )

              keychain_pass = "temp1234"
              keychain_path = File.expand_path("~/Library/Keychains/build.keychain-db")

              create_keychain(
                name: "build.keychain",
                password: keychain_pass,
                default_keychain: true,
                unlock: true,
                timeout: 3600,
                lock_when_sleeps: false
              )

              cert(
                development: false,
                api_key: api_key,
                team_id: ENV["TEAM_ID"],
                keychain_path: keychain_path,
                keychain_password: keychain_pass
              )

              # ===== تصدير الشهادة لحفظها كسرّ (مرة واحدة) =====
              begin
                cert_path = lane_context[SharedValues::CERT_FILE_PATH]
                UI.important("CERT_FILE: #{cert_path}")
                identity = sh("security find-identity -v -p codesigning #{keychain_path} | head -2", log: false)
                UI.important(identity)
                p12_path = File.expand_path("export_cert.p12", Dir.pwd)
                cert_name = sh(%Q(security find-identity -v -p codesigning #{keychain_path} | grep 'Apple Distribution' | head -1 | sed 's/.*"\\(.*\\)"/\\1/), log: false).strip
                UI.important("exporting identity: #{cert_name}")
                sh(%Q(security export -k #{keychain_path} -t identities -f pkcs12 -P "exportpass123" -o #{p12_path}))
                b64 = sh("base64 -i #{p12_path} | tr -d '\\n'", log: false)
                UI.important("========== COPY P12 BASE64 BELOW (save as secret CERT_P12_BASE64) ==========")
                puts b64
                UI.important("========== COPY P12 BASE64 ABOVE ==========")
              rescue => e
                UI.important("p12 export skipped: #{e.class} - #{e.message}")
              end
              # ================================================

              sigh(
                app_identifier: ENV["BUNDLE_ID"],
                api_key: api_key,
                team_id: ENV["TEAM_ID"],
                development: false,
                force: true
              )

              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                team_id: ENV["TEAM_ID"],
                bundle_identifier: ENV["BUNDLE_ID"],
                code_sign_identity: "Apple Distribution",
                profile_name: lane_context[SharedValues::SIGH_NAME]
              )

              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                configuration: "Release",
                export_method: "app-store",
                skip_profile_detection: true,
                export_options: {
                  provisioningProfiles: {
                    ENV["BUNDLE_ID"] => lane_context[SharedValues::SIGH_NAME]
                  }
                }
              )

              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          RUBY

      - name: Run fastlane
        working-directory: ios
        run: |
          gem install fastlane --no-document
          fastlane beta

      - name: Done
        run: echo "uploaded to TestFlight"
